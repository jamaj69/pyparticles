name: Release to PyPI and GitHub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify tag matches project version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          print(f"tag={tag} project.version={version}")
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match expected {expected!r}")
          PY

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PyParticles3
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create or update GitHub Release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the exact distributions published to PyPI
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create or update GitHub Release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; preserving its notes."
            gh release edit "$tag" --title "PyParticles3 $version"
          else
            if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
              gh release create "$tag" \
                --verify-tag \
                --title "PyParticles3 $version" \
                --generate-notes \
                --prerelease
            else
              gh release create "$tag" \
                --verify-tag \
                --title "PyParticles3 $version" \
                --generate-notes
            fi
          fi

          echo "Attaching the same wheel/sdist artifact that was published to PyPI:"
          sha256sum dist/*
          gh release upload "$tag" dist/* --clobber
