name: CI

on:
  push:
    branches:
      - master
      - modernize/python3-opencl
      - package/pyparticles3
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q pyparticles tests

      - name: Run unit tests
        run: python -W default -m unittest discover -v -s tests

  build:
    name: Build wheel and sdist
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel smoke test
        run: |
          python -m pip install dist/*.whl
          expected="$(python -c 'from importlib.metadata import version; print(version("PyParticles3"))')"
          test "$(pyparticles3 --version)" = "$expected"
          test "$(pyparticles_app --version)" = "$expected"
          test "$(python -m pyparticles --version)" = "$expected"
          echo "PyParticles3 wheel and CLI version: $expected"
