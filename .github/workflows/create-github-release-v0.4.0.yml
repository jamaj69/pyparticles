name: Backfill GitHub Release v0.4.0 assets

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/create-github-release-v0.4.0.yml"

permissions:
  actions: read
  contents: write

jobs:
  release-assets:
    name: Attach exact PyPI distributions
    runs-on: ubuntu-latest

    steps:
      - name: Download distributions from the original v0.4.0 release run
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          repository: jamaj69/pyparticles
          run-id: 33577097947
          github-token: ${{ github.token }}

      - name: Verify published artifact hashes
        run: |
          set -euo pipefail
          cd dist
          printf '%s  %s\n' \
            'ea964d0fc482b495d0f680cc7ebbb550121d47653dccd93d3d4badd87e21171f' \
            'pyparticles3-0.4.0-py3-none-any.whl' \
            'd0746d6ce942019719feb85898f901dd8e57b8401b94d464f4d6551037cc626d' \
            'pyparticles3-0.4.0.tar.gz' \
            | sha256sum -c -

      - name: Attach wheel and sdist to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.4.0 \
            dist/pyparticles3-0.4.0-py3-none-any.whl \
            dist/pyparticles3-0.4.0.tar.gz \
            --clobber
